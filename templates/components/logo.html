{% load static %}

<div class="d-flex align-items-center">

    {% if branding.logo %}

        <img
            src="{{ branding.logo.url }}"
            width="45"
            class="me-2"
            alt="CampusPay Logo">

    {% else %}

        <img
            src="{% static 'images/logo/cp-logo.svg' %}"
            width="45"
            class="me-2"
            alt="CampusPay Logo">

    {% endif %}

    <div>

        <h5 class="mb-0 fw-bold text-white">

            {{ system_settings.system_name }}

        </h5>

        <small class="text-light">

            Payment Platform with Zero Worries

        </small>

    </div>

</div>
