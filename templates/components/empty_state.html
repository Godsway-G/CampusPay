<div class="text-center py-5">

    <i class="{{ icon|default:'bi bi-folder2-open' }} display-4 text-secondary"></i>

    <h4 class="mt-3">

        {{ title }}

    </h4>

    <p class="text-muted">

        {{ message }}

    </p>

    {% if button_url %}

        <a href="{{ button_url }}"

           class="btn btn-primary">

            {{ button_text }}

        </a>

    {% endif %}

</div>
