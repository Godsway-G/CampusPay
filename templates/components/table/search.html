<form method="GET" class="mb-4">

    <div class="row">

        <div class="col-md-8">

            <input
                type="search"
                name="search"
                class="form-control"
                placeholder="Search..."
                value="{{ search }}">

        </div>

        <div class="col-md-2 d-grid">

            <button
                class="btn btn-primary">

                Search

            </button>

        </div>

        <div class="col-md-2 d-grid">

            <a
                href="{{ request.path }}"
                class="btn btn-outline-secondary">

                Reset

            </a>

        </div>

    </div>

</form>
