{% extends "public_base.html" %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold">
            Welcome to CampusPay
        </h2>

        <p class="text-muted">
            Select your access portal
        </p>

    </div>


    <div class="row justify-content-center g-4">


        <div class="col-md-5">

            <div class="card shadow-sm border-0 rounded-4 p-4 text-center">

                <i class="bi bi-shield-lock-fill display-4 text-primary"></i>


                <h4 class="mt-3">
                    Administrator
                </h4>


                <p class="text-muted">

                    Manage members, payments,
                    receipts and reports.

                </p>


                <a href="{% url 'accounts:login' %}"
                   class="btn btn-primary rounded-pill">

                    Admin Login

                </a>

            </div>

        </div>




        <div class="col-md-5">

            <div class="card shadow-sm border-0 rounded-4 p-4 text-center">

                <i class="bi bi-mortarboard-fill display-4 text-success"></i>


                <h4 class="mt-3">
                    Student Portal
                </h4>


                <p class="text-muted">

                    View balances, make payments
                    and receipts.

                </p>


                <a href="{% url 'portal:login' %}"
                   class="btn btn-success rounded-pill">

                    Student Login

                </a>


            </div>

        </div>


    </div>

</div>

{% endblock %}
