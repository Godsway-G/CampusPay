{% extends "student_base.html" %}


{% block title %}
Student Dashboard
{% endblock %}



{% block content %}


<div class="container-fluid">


<div class="mb-4">

<h2 class="fw-bold">

Welcome Student

</h2>


<p class="text-muted">

Manage your payments and academic fees.

</p>


</div>



<div class="row g-4">


<div class="col-md-3">

<div class="card shadow-sm border-0">

<div class="card-body">

<small class="text-muted">
Total Fee
</small>


<h3 class="fw-bold">

GH₵ {{ total_fee }}

</h3>


</div>

</div>

</div>




<div class="col-md-3">

<div class="card shadow-sm border-0">

<div class="card-body">


<small class="text-muted">
Paid
</small>


<h3 class="fw-bold">

GH₵ {{ total_paid }}

</h3>


</div>

</div>

</div>




<div class="col-md-3">

<div class="card shadow-sm border-0">


<div class="card-body">


<small class="text-muted">
Outstanding
</small>


<h3 class="fw-bold">

GH₵ {{ outstanding }}

</h3>


</div>


</div>

</div>




<div class="col-md-3">

<div class="card shadow-sm border-0">


<div class="card-body">


<small class="text-muted">
Status
</small>


<h3 class="fw-bold">

{{ status }}

</h3>


</div>


</div>

</div>


</div>


{% endblock %}
