{% extends "admin_base.html" %}

{% block title %}
Member Reports
{% endblock %}

{% block content %}

<div class="container-fluid">

    <h2 class="fw-bold mb-4">

        Member Reports

    </h2>

    <div class="row g-4">

        <div class="col-md-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5>Member Directory</h5>

                    <p class="text-muted">

                        Complete list of association members.

                    </p>

                    <a href="#"
                       class="btn btn-outline-primary">

                        Open Report

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5>Department Summary</h5>

                    <p class="text-muted">

                        Members grouped by department.

                    </p>

                    <a href="#"
                       class="btn btn-outline-primary">

                        Open Report

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
